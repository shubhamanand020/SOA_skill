spring:
  application:
    name: GatewayService
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service
              uri: http://localhost:8002
              predicates:
                - Path=/patient
            - id: patient-service-subpaths
              uri: http://localhost:8002
              predicates:
                - Path=/patient/**
            - id: doctor-service
              uri: http://localhost:8003
              predicates:
                - Path=/doctor
            - id: doctor-service-subpaths
              uri: http://localhost:8003
              predicates:
                - Path=/doctor/**
server:
  port: 8080
